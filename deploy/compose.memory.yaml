services:
  backend:
    mem_limit: 768m
    memswap_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
      LOGGING_LEVEL_COM_VBLOG: INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
  web:
    mem_limit: 128m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
